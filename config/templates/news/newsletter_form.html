{% extends 'base.html' %}
{% block title %}Create Newsletter{% endblock %}

{% block content %}
<div class="card" style="max-width: 800px; margin: 0 auto;">
    <h2>Create Newsletter</h2>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Title</label>
            <input type="text" name="title" required>
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea name="description" rows="3" required></textarea>
        </div>
        <div class="form-group">
            <label>Select Articles</label>
            <select name="articles" multiple size="10" required>
                {% for article in articles %}
                <option value="{{ article.id }}">{{ article.title }}</option>
                {% endfor %}
            </select>
            <small style="color: #666;">Hold Ctrl/Cmd to select multiple articles</small>
        </div>
        <button type="submit" class="btn">Create Newsletter</button>
        <a href="{% url 'news:newsletter_list' %}" class="btn" 
           style="background: #6c757d;">Cancel</a>
    </form>
</div>
{% endblock %}
